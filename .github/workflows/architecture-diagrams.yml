name: Render architecture PNGs
on:
  push:
    branches: [main]
    paths:
      - 'assets/architecture-src/**'
      - '.github/workflows/architecture-diagrams.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Render PNG diagrams
        run: |
          mkdir -p assets/architecture
          for f in assets/architecture-src/*.svg; do
            name=$(basename "$f" .svg)
            rsvg-convert -w 1200 -h 675 "$f" -o "assets/architecture/$name.png"
          done
      - name: Commit rendered diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/architecture
          if ! git diff --cached --quiet; then
            git commit -m "Render architecture diagrams"
            git push origin main
          fi
