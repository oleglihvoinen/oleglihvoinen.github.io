</defs><text x="65" y="75" class="title">C Mini Database Engine</text><text x="65" y="112" class="sub">A compact storage-engine case exposing mechanics beneath higher-level relational database systems.</text><line x1="65" y1="138" x2="1135" y2="138" stroke="#D9E0EA"/><rect x="65" y="210" width="205" height="210" rx="18" fill="#fff" stroke="#274060" stroke-width="2"/><path d="M83 210H252Q270 210 270 228V258H65V228Q65 210 83 210Z" fill="#274060"/><text x="83" y="241" class="bt">CLI</text><text x="83" y="288" class="body">INSERT</text><text x="83" y="316" class="body">SELECT</text><text x="83" y="344" class="body">DELETE</text><text x="83" y="372" class="body">LIST</text><rect x="325" y="195" width="230" height="240" rx="18" fill="#fff" stroke="#2F6FED" stroke-width="2"/><path d="M343 195H537Q555 195 555 213V243H325V213Q325 195 343 195Z" fill="#2F6FED"/><text x="343" y="226" class="bt">Record layer</text><text x="343" y="273" class="body">DbRecord</text><text x="343" y="301" class="body">Fixed layout</text><text x="343" y="329" class="body">ID uniqueness</text><text x="343" y="357" class="body">Tombstone flag</text><rect x="610" y="195" width="210" height="240" rx="18" fill="#fff" stroke="#7357D8" stroke-width="2"/><path d="M628 195H802Q820 195 820 213V243H610V213Q610 195 628 195Z" fill="#7357D8"/><text x="628" y="226" class="bt">Storage layer</text><text x="628" y="273" class="body">Binary file</text><text x="628" y="301" class="body">Append inserts</text><text x="628" y="329" class="body">File seek</text><text x="628" y="357" class="body">Sequential scan</text><rect x="875" y="195" width="260" height="240" rx="18" fill="#fff" stroke="#2D9D78" stroke-width="2"/><path d="M893 195H1117Q1135 195 1135 213V243H875V213Q875 195 893 195Z" fill="#2D9D78"/><text x="893" y="226" class="bt">Evolution</text><text x="893" y="273" class="body">Page manager</text><text x="893" y="301" class="body">B+tree index</text><text x="893" y="329" class="body">WAL</text><text x="893" y="357" class="body">Recovery</text><line x1="270" y1="315" x2="325" y2="315" stroke="#5B657A" stroke-width="3" marker-end="url(#arrow)"/><text x="297.5" y="305" text-anchor="middle" class="small">commands</text><line x1="555" y1="315" x2="610" y2="315" stroke="#5B657A" stroke-width="3" marker-end="url(#arrow)"/><text x="582.5" y="305" text-anchor="middle" class="small">persist</text><line x1="820" y1="315" x2="875" y2="315" stroke="#5B657A" stroke-width="3" marker-end="url(#arrow)"/><text x="847.5" y="305" text-anchor="middle" class="small">next</text><rect x="245" y="485" width="710" height="105" rx="18" fill="#fff" stroke="#C9A227" stroke-width="2"/><rect x="245" y="485" width="710" height="42" rx="18" fill="#C9A227"/><text x="265" y="512" class="bt">Learning objective</text><text x="265" y="552" class="body">Start with visible sequential storage mechanics before introducing indexes and transactions.</text><text x="265" y="578" class="body">The design makes record layout, persistence and logical deletion easy to inspect.</text><text x="65" y="635" class="foot">TECHNOLOGY FOCUS</text><text x="220" y="635" class="small">C · Linux · binary persistence · storage-engine concepts · Make · CI</text><text x="1135" y="635" text-anchor="end" class="small">Portfolio / reference architecture</text></svg>