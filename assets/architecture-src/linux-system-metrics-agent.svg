</defs><text x="65" y="75" class="title">Linux System Metrics Agent</text><text x="65" y="112" class="sub">Low-level host telemetry in C with a clean boundary to downstream observability and data platforms.</text><line x1="65" y1="138" x2="1135" y2="138" stroke="#D9E0EA"/><rect x="65" y="210" width="210" height="210" rx="18" fill="#fff" stroke="#274060" stroke-width="2"/><path d="M83 210H257Q275 210 275 228V258H65V228Q65 210 83 210Z" fill="#274060"/><text x="83" y="241" class="bt">Linux kernel</text><text x="83" y="288" class="body">/proc/stat</text><text x="83" y="316" class="body">/proc/meminfo</text><text x="83" y="344" class="body">/proc/net/dev</text><text x="83" y="372" class="body">statvfs()</text><rect x="335" y="195" width="220" height="240" rx="18" fill="#fff" stroke="#2F6FED" stroke-width="2"/><path d="M353 195H537Q555 195 555 213V243H335V213Q335 195 353 195Z" fill="#2F6FED"/><text x="353" y="226" class="bt">C collector</text><text x="353" y="273" class="body">CPU sampling</text><text x="353" y="301" class="body">Memory / disk</text><text x="353" y="329" class="body">Network counters</text><text x="353" y="357" class="body">JSONL output</text><rect x="615" y="195" width="220" height="240" rx="18" fill="#fff" stroke="#7357D8" stroke-width="2"/><path d="M633 195H817Q835 195 835 213V243H615V213Q615 195 633 195Z" fill="#7357D8"/><text x="633" y="226" class="bt">Service layer</text><text x="633" y="273" class="body">systemd</text><text x="633" y="301" class="body">Restart policy</text><text x="633" y="329" class="body">Hardened service</text><text x="633" y="357" class="body">journald</text><rect x="895" y="195" width="240" height="240" rx="18" fill="#fff" stroke="#2D9D78" stroke-width="2"/><path d="M913 195H1117Q1135 195 1135 213V243H895V213Q895 195 913 195Z" fill="#2D9D78"/><text x="913" y="226" class="bt">Consumers</text><text x="913" y="273" class="body">Kafka / OTel</text><text x="913" y="301" class="body">Observability</text><text x="913" y="329" class="body">Warehouse</text><text x="913" y="357" class="body">Dashboards</text><line x1="275" y1="315" x2="335" y2="315" stroke="#5B657A" stroke-width="3" marker-end="url(#arrow)"/><text x="305" y="305" text-anchor="middle" class="small">read</text><line x1="555" y1="315" x2="615" y2="315" stroke="#5B657A" stroke-width="3" marker-end="url(#arrow)"/><text x="585" y="305" text-anchor="middle" class="small">run</text><line x1="835" y1="315" x2="895" y2="315" stroke="#5B657A" stroke-width="3" marker-end="url(#arrow)"/><text x="865" y="305" text-anchor="middle" class="small">ship</text><rect x="245" y="485" width="710" height="105" rx="18" fill="#fff" stroke="#C9A227" stroke-width="2"/><rect x="245" y="485" width="710" height="42" rx="18" fill="#C9A227"/><text x="265" y="512" class="bt">Engineering boundary</text><text x="265" y="552" class="body">Collection is independent from transport, keeping the agent small and testable.</text><text x="265" y="578" class="body">Different delivery mechanisms can be attached without rewriting the metrics layer.</text><text x="65" y="635" class="foot">TECHNOLOGY FOCUS</text><text x="220" y="635" class="small">C · Linux · POSIX · /proc · statvfs · systemd · JSON · observability</text><text x="1135" y="635" text-anchor="end" class="small">Portfolio / reference architecture</text></svg>