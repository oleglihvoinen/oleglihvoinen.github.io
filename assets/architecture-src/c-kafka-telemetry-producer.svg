</defs><text x="65" y="75" class="title">C Kafka Telemetry Producer</text><text x="65" y="112" class="sub">Native event publishing with keyed machine telemetry, delivery handling and a versioned contract.</text><line x1="65" y1="138" x2="1135" y2="138" stroke="#D9E0EA"/><rect x="65" y="210" width="205" height="210" rx="18" fill="#fff" stroke="#274060" stroke-width="2"/><path d="M83 210H252Q270 210 270 228V258H65V228Q65 210 83 210Z" fill="#274060"/><text x="83" y="241" class="bt">Edge process</text><text x="83" y="288" class="body">Machine / sensor</text><text x="83" y="316" class="body">C application</text><text x="83" y="344" class="body">Machine ID</text><rect x="325" y="195" width="230" height="240" rx="18" fill="#fff" stroke="#2F6FED" stroke-width="2"/><path d="M343 195H537Q555 195 555 213V243H325V213Q325 195 343 195Z" fill="#2F6FED"/><text x="343" y="226" class="bt">librdkafka</text><text x="343" y="273" class="body">bootstrap servers</text><text x="343" y="301" class="body">message key</text><text x="343" y="329" class="body">JSON payload</text><text x="343" y="357" class="body">delivery callback</text><rect x="610" y="195" width="210" height="240" rx="18" fill="#fff" stroke="#E48A2A" stroke-width="2"/><path d="M628 195H802Q820 195 820 213V243H610V213Q610 195 628 195Z" fill="#E48A2A"/><text x="628" y="226" class="bt">Kafka</text><text x="628" y="273" class="body">telemetry.v1</text><text x="628" y="301" class="body">Partitions</text><text x="628" y="329" class="body">Key ordering</text><text x="628" y="357" class="body">Offsets</text><rect x="875" y="195" width="260" height="240" rx="18" fill="#fff" stroke="#2D9D78" stroke-width="2"/><path d="M893 195H1117Q1135 195 1135 213V243H875V213Q875 195 893 195Z" fill="#2D9D78"/><text x="893" y="226" class="bt">Downstream</text><text x="893" y="273" class="body">Consumer group</text><text x="893" y="301" class="body">Validation</text><text x="893" y="329" class="body">Snowflake / lake</text><text x="893" y="357" class="body">Monitoring</text><line x1="270" y1="315" x2="325" y2="315" stroke="#5B657A" stroke-width="3" marker-end="url(#arrow)"/><text x="297.5" y="305" text-anchor="middle" class="small">event</text><line x1="555" y1="315" x2="610" y2="315" stroke="#5B657A" stroke-width="3" marker-end="url(#arrow)"/><text x="582.5" y="305" text-anchor="middle" class="small">produce</text><line x1="820" y1="315" x2="875" y2="315" stroke="#5B657A" stroke-width="3" marker-end="url(#arrow)"/><text x="847.5" y="305" text-anchor="middle" class="small">consume</text><rect x="245" y="485" width="710" height="105" rx="18" fill="#fff" stroke="#C9A227" stroke-width="2"/><rect x="245" y="485" width="710" height="42" rx="18" fill="#C9A227"/><text x="265" y="512" class="bt">Data contract</text><text x="265" y="552" class="body">JSON Schema defines version, machine ID, timestamp, temperature, RPM and status.</text><text x="265" y="578" class="body">Production evolution can add Schema Registry with Avro or Protobuf.</text><text x="65" y="635" class="foot">TECHNOLOGY FOCUS</text><text x="220" y="635" class="small">C · Linux · librdkafka · Apache Kafka · JSON Schema · event streaming</text><text x="1135" y="635" text-anchor="end" class="small">Portfolio / reference architecture</text></svg>