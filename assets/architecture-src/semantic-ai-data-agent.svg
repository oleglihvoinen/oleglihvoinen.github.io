</defs><text x="65" y="75" class="title">Governed Semantic AI Data Agent</text><text x="65" y="112" class="sub">Approved business semantics sit between natural-language questions and physical data models.</text><line x1="65" y1="138" x2="1135" y2="138" stroke="#D9E0EA"/><rect x="40" y="195" width="160" height="240" rx="18" fill="#fff" stroke="#274060" stroke-width="2"/><path d="M58 195H182Q200 195 200 213V243H40V213Q40 195 58 195Z" fill="#274060"/><text x="58" y="226" class="bt">Question</text><text x="58" y="273" class="body">Natural language</text><text x="58" y="301" class="body">Business intent</text><text x="58" y="329" class="body">Period / filters</text><rect x="230" y="195" width="165" height="240" rx="18" fill="#fff" stroke="#7357D8" stroke-width="2"/><path d="M248 195H377Q395 195 395 213V243H230V213Q230 195 248 195Z" fill="#7357D8"/><text x="248" y="226" class="bt">AI agent</text><text x="248" y="273" class="body">Intent parsing</text><text x="248" y="301" class="body">Tool calling</text><text x="248" y="329" class="body">Ambiguity</text><rect x="425" y="195" width="175" height="240" rx="18" fill="#fff" stroke="#2F6FED" stroke-width="2"/><path d="M443 195H582Q600 195 600 213V243H425V213Q425 195 443 195Z" fill="#2F6FED"/><text x="443" y="226" class="bt">Semantic API</text><text x="443" y="273" class="body">Approved metrics</text><text x="443" y="301" class="body">Dimensions</text><text x="443" y="329" class="body">Ownership</text><text x="443" y="357" class="body">Provenance</text><rect x="630" y="195" width="175" height="240" rx="18" fill="#fff" stroke="#D95C5C" stroke-width="2"/><path d="M648 195H787Q805 195 805 213V243H630V213Q630 195 648 195Z" fill="#D95C5C"/><text x="648" y="226" class="bt">Governance</text><text x="648" y="273" class="body">Permissions</text><text x="648" y="301" class="body">Validation</text><text x="648" y="329" class="body">Auditability</text><text x="648" y="357" class="body">Policy</text><rect x="835" y="195" width="165" height="240" rx="18" fill="#fff" stroke="#E48A2A" stroke-width="2"/><path d="M853 195H982Q1000 195 1000 213V243H835V213Q835 195 853 195Z" fill="#E48A2A"/><text x="853" y="226" class="bt">Data layer</text><text x="853" y="273" class="body">Snowflake/dbt</text><text x="853" y="301" class="body">or Fabric</text><text x="853" y="329" class="body">Gold models</text><rect x="1030" y="195" width="125" height="240" rx="18" fill="#fff" stroke="#2D9D78" stroke-width="2"/><path d="M1048 195H1137Q1155 195 1155 213V243H1030V213Q1030 195 1048 195Z" fill="#2D9D78"/><text x="1048" y="226" class="bt">Result</text><text x="1048" y="273" class="body">Data</text><text x="1048" y="301" class="body">Source</text><text x="1048" y="329" class="body">Provenance</text><line x1="200" y1="315" x2="230" y2="315" stroke="#5B657A" stroke-width="3" marker-end="url(#arrow)"/><text x="215" y="305" text-anchor="middle" class="small">ask</text><line x1="395" y1="315" x2="425" y2="315" stroke="#5B657A" stroke-width="3" marker-end="url(#arrow)"/><text x="410" y="305" text-anchor="middle" class="small">resolve</text><line x1="600" y1="315" x2="630" y2="315" stroke="#5B657A" stroke-width="3" marker-end="url(#arrow)"/><text x="615" y="305" text-anchor="middle" class="small">check</text><line x1="805" y1="315" x2="835" y2="315" stroke="#5B657A" stroke-width="3" marker-end="url(#arrow)"/><text x="820" y="305" text-anchor="middle" class="small">query</text><line x1="1000" y1="315" x2="1030" y2="315" stroke="#5B657A" stroke-width="3" marker-end="url(#arrow)"/><text x="1015" y="305" text-anchor="middle" class="small">return</text><rect x="245" y="485" width="710" height="105" rx="18" fill="#fff" stroke="#C9A227" stroke-width="2"/><rect x="245" y="485" width="710" height="42" rx="18" fill="#C9A227"/><text x="265" y="512" class="bt">Trust boundary</text><text x="265" y="552" class="body">The model does not receive unrestricted warehouse access.</text><text x="265" y="578" class="body">Metrics, dimensions, permissions and provenance constrain the analytical path.</text><text x="65" y="635" class="foot">TECHNOLOGY FOCUS</text><text x="220" y="635" class="small">Python · FastAPI · semantic contracts · Snowflake/dbt · Fabric · LLM grounding · governance</text><text x="1135" y="635" text-anchor="end" class="small">Portfolio / reference architecture</text></svg>