</defs><text x="65" y="75" class="title">CDC: PostgreSQL → Debezium → Kafka → Snowflake</text><text x="65" y="112" class="sub">Near-real-time change propagation without repeated full-table extracts.</text><line x1="65" y1="138" x2="1135" y2="138" stroke="#D9E0EA"/><rect x="40" y="195" width="160" height="240" rx="18" fill="#fff" stroke="#274060" stroke-width="2"/><path d="M58 195H182Q200 195 200 213V243H40V213Q40 195 58 195Z" fill="#274060"/><text x="58" y="226" class="bt">PostgreSQL</text><text x="58" y="273" class="body">Customers</text><text x="58" y="301" class="body">Orders</text><text x="58" y="329" class="body">WAL</text><text x="58" y="357" class="body">I / U / D</text><rect x="230" y="195" width="165" height="240" rx="18" fill="#fff" stroke="#D95C5C" stroke-width="2"/><path d="M248 195H377Q395 195 395 213V243H230V213Q230 195 248 195Z" fill="#D95C5C"/><text x="248" y="226" class="bt">Debezium</text><text x="248" y="273" class="body">pgoutput</text><text x="248" y="301" class="body">CDC envelope</text><text x="248" y="329" class="body">Schema + op</text><rect x="425" y="195" width="155" height="240" rx="18" fill="#fff" stroke="#E48A2A" stroke-width="2"/><path d="M443 195H562Q580 195 580 213V243H425V213Q425 195 443 195Z" fill="#E48A2A"/><text x="443" y="226" class="bt">Kafka</text><text x="443" y="273" class="body">Topics</text><text x="443" y="301" class="body">Partitions</text><text x="443" y="329" class="body">Offsets</text><text x="443" y="357" class="body">Replay</text><rect x="610" y="195" width="180" height="240" rx="18" fill="#fff" stroke="#2F6FED" stroke-width="2"/><path d="M628 195H772Q790 195 790 213V243H610V213Q610 195 628 195Z" fill="#2F6FED"/><text x="628" y="226" class="bt">Snowflake RAW</text><text x="628" y="273" class="body">VARIANT events</text><text x="628" y="301" class="body">Topic/partition</text><text x="628" y="329" class="body">Offset lineage</text><rect x="820" y="195" width="155" height="240" rx="18" fill="#fff" stroke="#7357D8" stroke-width="2"/><path d="M838 195H957Q975 195 975 213V243H820V213Q820 195 838 195Z" fill="#7357D8"/><text x="838" y="226" class="bt">dbt</text><text x="838" y="273" class="body">Staging</text><text x="838" y="301" class="body">Incremental</text><text x="838" y="329" class="body">Current state</text><rect x="1005" y="195" width="150" height="240" rx="18" fill="#fff" stroke="#2D9D78" stroke-width="2"/><path d="M1023 195H1137Q1155 195 1155 213V243H1005V213Q1005 195 1023 195Z" fill="#2D9D78"/><text x="1023" y="226" class="bt">Use</text><text x="1023" y="273" class="body">BI</text><text x="1023" y="301" class="body">REST API</text><text x="1023" y="329" class="body">AI agent</text><line x1="200" y1="315" x2="230" y2="315" stroke="#5B657A" stroke-width="3" marker-end="url(#arrow)"/><text x="215" y="305" text-anchor="middle" class="small">WAL</text><line x1="395" y1="315" x2="425" y2="315" stroke="#5B657A" stroke-width="3" marker-end="url(#arrow)"/><text x="410" y="305" text-anchor="middle" class="small">events</text><line x1="580" y1="315" x2="610" y2="315" stroke="#5B657A" stroke-width="3" marker-end="url(#arrow)"/><text x="595" y="305" text-anchor="middle" class="small">ingest</text><line x1="790" y1="315" x2="820" y2="315" stroke="#5B657A" stroke-width="3" marker-end="url(#arrow)"/><text x="805" y="305" text-anchor="middle" class="small">model</text><line x1="975" y1="315" x2="1005" y2="315" stroke="#5B657A" stroke-width="3" marker-end="url(#arrow)"/><text x="990" y="305" text-anchor="middle" class="small">serve</text><rect x="245" y="485" width="710" height="105" rx="18" fill="#fff" stroke="#C9A227" stroke-width="2"/><rect x="245" y="485" width="710" height="42" rx="18" fill="#C9A227"/><text x="265" y="512" class="bt">Reliability model</text><text x="265" y="552" class="body">Kafka supports durable offsets and replay; RAW keeps event metadata for lineage.</text><text x="265" y="578" class="body">dbt derives current-state analytics while deletes remain explicit CDC operations.</text><text x="65" y="635" class="foot">TECHNOLOGY FOCUS</text><text x="220" y="635" class="small">PostgreSQL · WAL · Debezium · Kafka · Snowflake · dbt · Docker Compose · CDC</text><text x="1135" y="635" text-anchor="end" class="small">Portfolio / reference architecture</text></svg>